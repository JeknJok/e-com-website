name: PHP and database regressions
on: [push, pull_request]
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-24.04
    services:
      database:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: local-test-only-password
          MARIADB_ROOT_HOST: "%"
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=30
    steps:
      - uses: actions/checkout@v4
      - name: Install PHP runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y php-cli php-mysql php-mbstring
      - name: Run regression suite
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: "3306"
          DB_USER: root
          DB_PASSWORD: local-test-only-password
        run: python3 tests/integration.py
