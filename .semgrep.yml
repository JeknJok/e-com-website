rules:
  - id: mae.php.untrusted-sql
    message: Use MAE's prepared query helpers; do not concatenate request values into SQL.
    severity: ERROR
    languages: [php]
    mode: taint
    pattern-sources:
      - pattern: $_GET[...]
      - pattern: $_POST[...]
      - pattern: $_REQUEST[...]
      - pattern: input(...)
    pattern-sanitizers:
      - pattern: positive_int(...)
      - pattern: (int) $VALUE
      - pattern: intval(...)
    pattern-sinks:
      - pattern: $DB->query($SQL, ...)
      - pattern: $DB->multi_query($SQL)
      - pattern: mysqli_query($DB, $SQL, ...)
  - id: mae.php.dynamic-evaluation
    message: Executing dynamically constructed PHP is not permitted.
    severity: ERROR
    languages: [php]
    pattern: eval(...)
  - id: mae.php.object-deserialization
    message: Use bounded JSON rather than PHP object deserialization.
    severity: ERROR
    languages: [php]
    pattern: unserialize(...)
  - id: mae.php.request-shell-command
    message: Keep request values out of shell commands; use fixed commands and structured arguments.
    severity: ERROR
    languages: [php]
    mode: taint
    pattern-sources:
      - pattern: $_GET[...]
      - pattern: $_POST[...]
      - pattern: input(...)
    pattern-sinks:
      - pattern: shell_exec(...)
      - pattern: exec(...)
      - pattern: system(...)
      - pattern: passthru(...)
