services:
  db:
    image: mariadb:11.4
    environment:
      MARIADB_DATABASE: NealleDB
      MARIADB_USER: mae
      MARIADB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Set DB_ROOT_PASSWORD in .env}
    volumes:
      - database:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 3s
      timeout: 3s
      retries: 30
  web:
    build: .
    ports:
      - "127.0.0.1:8080:80"
    environment:
      DB_HOST: db
      DB_NAME: NealleDB
      DB_USER: mae
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - uploads:/var/www/html/assets/uploads
  expiry:
    build: .
    command: ["sh", "-c", "while true; do php scripts/expire-orders.php; sleep 60; done"]
    environment:
      DB_HOST: db
      DB_NAME: NealleDB
      DB_USER: mae
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    depends_on:
      db:
        condition: service_healthy
volumes:
  database:
  uploads:
