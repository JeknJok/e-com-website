ServerTokens Prod
ServerSignature Off
TraceEnable Off
LimitRequestBody 4194304
Timeout 30
KeepAliveTimeout 3
LogFormat "%t \"%m %U %H\" %>s %b" mae
<IfModule mpm_prefork_module>
    StartServers 2
    MinSpareServers 1
    MaxSpareServers 2
    MaxRequestWorkers 4
    MaxConnectionsPerChild 500
</IfModule>
<Directory /var/www/html>
    AllowOverride None
    Options -Indexes
    Require all granted
    RewriteEngine On
    RewriteRule ^(?:app|database|scripts|tests|vendor|docs|docker|\.git)(?:/|$) - [F,L,NC]
    RewriteRule ^admin/shop_admin\.php$ admin/Shop_admin.php [L]
    <FilesMatch "^(?:config\.|\.|composer\.|package(?:-lock)?\.json)|\.(?:sql|ini|log|ya?ml|toml|sh|key|maebackup)$">
        Require all denied
    </FilesMatch>
</Directory>
<Directory /var/www/html/assets/uploads>
    AllowOverride None
    Options -Indexes -ExecCGI
    AcceptPathInfo Off
    Require all denied
    <IfModule php_module>
        php_admin_flag engine Off
    </IfModule>
    <FilesMatch "(?i)^[A-Za-z0-9_-]+\.(?:jpe?g|png|webp)$">
        Require all granted
        SetHandler default-handler
    </FilesMatch>
</Directory>
Header always set X-Content-Type-Options "nosniff"
Header always set Referrer-Policy "no-referrer"
Header always set X-Frame-Options "DENY"
Header always set Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()"

Header onsuccess unset Content-Security-Policy
Header always set Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; base-uri 'self'; form-action 'self'; object-src 'none'; frame-ancestors 'none'"
